<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 74" width="260" height="74">
  <defs>
    <style>
      .tile-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 500; }
      .logo-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15px; font-weight: 600; }
    </style>
  </defs>

  <!-- Floating U tile (blue, rotated ~-8deg, positioned above gap between J and M) -->
  <g transform="translate(68, 2) rotate(-8, 22, 22)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="1.5"/>
    <text x="22" y="30" text-anchor="middle" fill="#185FA5" class="tile-text">U</text>
  </g>

  <!-- J tile -->
  <g transform="translate(4, 28)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"/>
    <text x="22" y="30" text-anchor="middle" fill="#1a1a1a" class="tile-text">J</text>
  </g>

  <!-- M tile -->
  <g transform="translate(54, 28)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"/>
    <text x="22" y="30" text-anchor="middle" fill="#1a1a1a" class="tile-text">M</text>
  </g>

  <!-- B tile -->
  <g transform="translate(104, 28)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"/>
    <text x="22" y="30" text-anchor="middle" fill="#1a1a1a" class="tile-text">B</text>
  </g>

  <!-- L tile -->
  <g transform="translate(154, 28)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"/>
    <text x="22" y="30" text-anchor="middle" fill="#1a1a1a" class="tile-text">L</text>
  </g>

  <!-- E tile -->
  <g transform="translate(204, 28)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#ffffff" stroke="rgba(0,0,0,0.22)" stroke-width="1.5"/>
    <text x="22" y="30" text-anchor="middle" fill="#1a1a1a" class="tile-text">E</text>
  </g>


</svg>
