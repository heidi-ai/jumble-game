name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: jumble-game/package-lock.json
      - run: npm install
        working-directory: jumble-game
      - run: npx vite build
        working-directory: jumble-game
        env:
          VITE_TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
